name: Build branch (no release)
on:
  push:
    branches: [ claude-redesign ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RPI-Student-redesign-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Draft pre-release (private, not OTA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redesign-debug-${{ github.run_number }}
          name: redesign debug ${{ github.run_number }}
          draft: true
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/*.apk
